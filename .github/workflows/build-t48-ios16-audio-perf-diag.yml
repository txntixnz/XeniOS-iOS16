name: Build T48 iOS16 audio/perf diagnostics

on:
  push:
    paths:
      - ".github/workflows/build-t48-ios16-audio-perf-diag.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-t48:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - name: Checkout backport repo
        uses: actions/checkout@v4

      - name: Select Xcode 15.0.1
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Checkout exact upstream XeniOS build 9849 source
        run: |
          git clone https://github.com/xenios-jp/XeniOS.git upstream
          cd upstream
          git checkout acfa2878a
          git submodule update --init --depth=1 -j$(sysctl -n hw.ncpu) \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //')
          git -C third_party/DirectXShaderCompiler submodule update --init --depth=1 \
            external/SPIRV-Headers external/SPIRV-Tools
          git submodule update --init --recursive --depth=1 \
            -j$(sysctl -n hw.ncpu) third_party/wxWidgets

      - name: Apply iOS 16 source backport
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()
          old = 'set(CMAKE_OSX_DEPLOYMENT_TARGET "18.0" CACHE STRING "Minimum iOS version")'
          new = 'set(CMAKE_OSX_DEPLOYMENT_TARGET "16.0" CACHE STRING "Minimum iOS version")'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/base/logging.cc")
          s = p.read_text()
          old = "#if XE_PLATFORM_ANDROID\n  // Throw an error that can be reported to the developers via the store.\n  std::abort();"
          new = "#if XE_PLATFORM_ANDROID || XE_PLATFORM_IOS\n  // iOS 16 has no quick_exit; abort also preserves a useful crash report.\n  std::abort();"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/base/memory_posix.cc")
          s = p.read_text()
          old = "  std::atexit(CleanupAtExit);\n  std::at_quick_exit(CleanupAtExit);"
          new = "  std::atexit(CleanupAtExit);\n#if !XE_PLATFORM_IOS\n  std::at_quick_exit(CleanupAtExit);\n#endif"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/app/xenia_main.cc")
          s = p.read_text()
          old = "  xe::FlushLog();\n  std::quick_exit(EXIT_SUCCESS);"
          new = "  xe::FlushLog();\n#if XE_PLATFORM_IOS\n  std::_Exit(EXIT_SUCCESS);\n#else\n  std::quick_exit(EXIT_SUCCESS);\n#endif"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/base/clock.cc")
          s = p.read_text()
          old = "DEFINE_bool(clock_no_scaling, false,"
          new = "DEFINE_bool(clock_no_scaling, true,"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/gpu/gpu_flags.cc")
          s = p.read_text()
          old = 'metal_residency_sets, "auto",'
          new = 'metal_residency_sets, "false",'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Xcode 15 / iOS 17 SDK cannot parse the iOS 26 UIGlassEffect types
          # even though the code is guarded with @available. Compile the same
          # pre-glass fallback path directly for this legacy-toolchain build.
          # Older Clang rejects static_cast<uint32_t -> union AttributeKey>.
          # This is byte-for-byte equivalent to the constructors below it.
          p = Path("src/xenia/kernel/xam/user_property.cc")
          s = p.read_text()
          old = "  property_id_ = static_cast<AttributeKey>(property_id);"
          new = "  property_id_.value = property_id;"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Xcode 15 / iOS 17 SDK lacks newer PHASE automatic head-tracking
          # APIs. iOS 16 uses the fixed-listener path, so compile that path only.
          p = Path("src/xenia/apu/phase/phase_audio_driver.mm")
          s = p.read_text()
          old = (
              "    if (cvars::apu_phase_head_tracking) {\n"
              "      d->listener.automaticHeadTrackingFlags =\n"
              "          PHASEAutomaticHeadTrackingFlagOrientation;\n"
              "      XELOGI(\"PHASEAudioDriver: automatic head tracking ENABLED\");\n"
              "    } else {\n"
              "      XELOGI(\"PHASEAudioDriver: head tracking disabled (fixed listener)\");\n"
              "    }\n"
          )
          new = (
              "    XELOGI(\"PHASEAudioDriver: head tracking disabled (fixed listener)\");\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # T15: For texture_load shaders, emit preprocessed MSL source
          # bytes (NUL-terminated) instead of an offline metallib. iOS 16 will
          # compile this source with its own Metal runtime, avoiding newer
          # metallib container/IR compatibility problems.
          p = Path("tools/build/shader_cc.cc")
          s = p.read_text()
          old = (
              "    auto lib_path = tmp_dir / (tag + \".metallib\");\n\n"
              "    auto cleanup = [&] {\n"
              "      std::error_code ec;\n"
              "      std::filesystem::remove(air_path, ec);\n"
              "      std::filesystem::remove(lib_path, ec);\n"
              "    };\n"
          )
          new = (
              "    auto lib_path = tmp_dir / (tag + \".metallib\");\n"
              "    auto source_path = tmp_dir / (tag + \".metal\");\n\n"
              "    auto cleanup = [&] {\n"
              "      std::error_code ec;\n"
              "      std::filesystem::remove(air_path, ec);\n"
              "      std::filesystem::remove(lib_path, ec);\n"
              "      std::filesystem::remove(source_path, ec);\n"
              "    };\n"
          )
          assert old in s
          s = s.replace(old, new, 1)

          old = (
              "    if (RunCommand({\"xcrun\", \"-sdk\", metal_sdk, \"metallib\", air_path.string(),\n"
              "                    \"-o\", lib_path.string()}) != 0) {\n"
          )
          inject = (
              "    const bool runtime_source =\n"
              "        identifier.rfind(\"texture_load_\", 0) == 0 ||\n"
              "        identifier == \"texture_upload_repack\" ||\n"
              "        identifier.rfind(\"resolve_host_\", 0) == 0;\n"
              "    if (runtime_source) {\n"
              "      std::vector<std::string> pp_cmd = {\n"
              "          \"xcrun\", \"-sdk\", metal_sdk, \"metal\", \"-x\", \"metal\",\n"
              "          \"-std=\" + metal_std, metal_min_version_flag, \"-D\",\n"
              "          \"SHADING_LANGUAGE_MSL_XE=1\", \"-w\"};\n"
              "      AppendDefines(&pp_cmd, defines, \"-D\");\n"
              "      if (!input_dir.empty()) {\n"
              "        pp_cmd.push_back(\"-I\");\n"
              "        pp_cmd.push_back(input_dir);\n"
              "      }\n"
              "      pp_cmd.push_back(\"-E\");\n"
              "      pp_cmd.push_back(input_path.string());\n"
              "      pp_cmd.push_back(\"-o\");\n"
              "      pp_cmd.push_back(source_path.string());\n"
              "      if (RunCommand(pp_cmd) != 0) {\n"
              "        std::fprintf(stderr, \"metal preprocess failed for %s\\n\",\n"
              "                     input_path.string().c_str());\n"
              "        cleanup();\n"
              "        return 1;\n"
              "      }\n"
              "      std::vector<uint8_t> source_bytes;\n"
              "      if (!ReadBinaryFile(source_path, &source_bytes)) {\n"
              "        cleanup();\n"
              "        return 1;\n"
              "      }\n"
              "      std::string runtime_msl(reinterpret_cast<const char*>(source_bytes.data()),\n"
              "                              source_bytes.size());\n"
              "      auto erase_line_containing = [&](std::string_view marker) {\n"
              "        size_t pos = 0;\n"
              "        while ((pos = runtime_msl.find(marker, pos)) != std::string::npos) {\n"
              "          size_t begin = runtime_msl.rfind('\\n', pos);\n"
              "          begin = begin == std::string::npos ? 0 : begin + 1;\n"
              "          size_t end = runtime_msl.find('\\n', pos);\n"
              "          if (end == std::string::npos) end = runtime_msl.size();\n"
              "          else ++end;\n"
              "          runtime_msl.erase(begin, end - begin);\n"
              "          pos = begin;\n"
              "        }\n"
              "      };\n"
              "      erase_line_containing(\"#pragma clang module import metal_types\");\n"
              "      erase_line_containing(\"#pragma clang module import metal_stdlib\");\n"
              "      runtime_msl.insert(0, \"#include <metal_stdlib>\\n\");\n"
              "      source_bytes.assign(runtime_msl.begin(), runtime_msl.end());\n"
              "      source_bytes.push_back(0);\n"
              "      cleanup();\n"
              "      return WriteMetallibHeader(output_path, identifier, source_bytes) ? 0 : 1;\n"
              "    }\n\n"
          )
          assert old in s
          s = s.replace(old, inject + old, 1)
          p.write_text(s)

          # T15 texture cache: the generated texture_load_*_metallib arrays
          # contain NUL-terminated preprocessed MSL source. Compile them on the
          # device with its native Metal compiler.
          p = Path("src/xenia/gpu/metal/metal_texture_cache.cc")
          s = p.read_text()
          old = (
              "    dispatch_data_t dispatch_data = dispatch_data_create(\n"
              "        data, size, nullptr, DISPATCH_DATA_DESTRUCTOR_DEFAULT);\n"
              "    MTL::Library* lib = device->newLibrary(dispatch_data, &error);\n"
              "    dispatch_release(dispatch_data);\n"
              "    if (!lib) {\n"
              "      XELOGE(\"MetalTextureCache: failed to create texture_load library: {}\",\n"
              "             error ? error->localizedDescription()->utf8String() : \"unknown\");\n"
              "      return nullptr;\n"
              "    }\n"
          )
          new = (
              "    static uint32_t runtime_msl_sequence = 0;\n"
              "    const uint32_t runtime_msl_id = runtime_msl_sequence++;\n"
              "    const char* msl_source = reinterpret_cast<const char*>(data);\n"
              "    NS::String* ns_source =\n"
              "        NS::String::string(msl_source, NS::UTF8StringEncoding);\n"
              "    MTL::CompileOptions* compile_options =\n"
              "        MTL::CompileOptions::alloc()->init();\n"
              "    compile_options->setFastMathEnabled(true);\n"
              "    compile_options->setLanguageVersion(MTL::LanguageVersion2_4);\n"
              "    MTL::Library* lib =\n"
              "        device->newLibrary(ns_source, compile_options, &error);\n"
              "    compile_options->release();\n"
              "    if (!lib) {\n"
              "      XELOGE(\"MetalTextureCache: runtime MSL #{} ({} bytes) compile failed: {}\",\n"
              "             runtime_msl_id, size,\n"
              "             error ? error->localizedDescription()->utf8String() : \"unknown\");\n"
              "      return nullptr;\n"
              "    }\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # T34: Source equivalents of the field-validated T23-T33 renderer
          # changes, plus the iOS 16 runtime direct-host resolve path.
          p = Path("src/xenia/gpu/metal/metal_pipeline_cache.cc")
          s = p.read_text()
          old = "DEFINE_bool(metal_native_msl_render, false,"
          new = "DEFINE_bool(metal_native_msl_render, true,"
          assert old in s
          s = s.replace(old, new, 1)
          old = "DEFINE_bool(metal_native_msl_helper_msc, true,"
          new = "DEFINE_bool(metal_native_msl_helper_msc, false,"
          assert old in s
          s = s.replace(old, new, 1)

          # T33: iOS 16 Metal aborts while serializing MTLBinaryArchive during
          # title teardown. Skip only the shutdown serialization call.
          old = (
              "        if (!pipeline_binary_archive_->serializeToURL(url, &error)) {\n"
              "          if (error) {\n"
              "            XELOGW(\"Metal binary archive serialize failed: {}\",\n"
              "                   error->localizedDescription()->utf8String());\n"
              "          }\n"
              "        }\n"
          )
          new = (
              "        // iOS 16 backport: skip shutdown MTLBinaryArchive serialization.\n"
              "        (void)url;\n"
              "        (void)error;\n"
          )
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # T26: only use compile options known to exist on iOS 16.
          p = Path("src/xenia/gpu/metal/metal_shader.cc")
          s = p.read_text()
          old = (
              "  MTL::CompileOptions* compile_options = nullptr;\n"
              "  if (cvars::metal_native_msl_debug_validation ||\n"
              "      !cvars::metal_native_msl_fast_math) {\n"
              "    compile_options = MTL::CompileOptions::alloc()->init();\n"
              "    compile_options->setMathMode(MTL::MathModeSafe);\n"
              "    compile_options->setMathFloatingPointFunctions(\n"
              "        MTL::MathFloatingPointFunctionsFast);\n"
              "    if (cvars::metal_native_msl_debug_validation) {\n"
              "      compile_options->setEnableLogging(true);\n"
              "      compile_options->setPreserveInvariance(true);\n"
              "    }\n"
              "    compile_options->setOptimizationLevel(MTL::LibraryOptimizationLevelDefault);\n"
              "  }\n"
          )
          new = (
              "  MTL::CompileOptions* compile_options =\n"
              "      MTL::CompileOptions::alloc()->init();\n"
              "  compile_options->setFastMathEnabled(true);\n"
              "  compile_options->setLanguageVersion(MTL::LanguageVersion2_4);\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # T27: avoid Metal mesh shaders. Use native MSL point/rectangle VS
          # expansion and PrimitiveProcessor quad-to-triangle conversion.
          p = Path("src/xenia/gpu/metal/metal_primitive_processor.cc")
          s = p.read_text()
          old = (
              "  const bool native_msl_mesh_primitive_lists =\n"
              "      native_msl_render && command_processor_.IsMeshShaderSupported();\n"
              "  const bool native_msl_expand_rectangle_lists =\n"
              "      native_msl_render && cvars::metal_native_msl_expand_rectangle_lists;\n"
          )
          new = (
              "  const bool native_msl_mesh_primitive_lists = false;\n"
              "  const bool native_msl_expand_rectangle_lists = native_msl_render;\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/gpu/metal/metal_command_processor.cc")
          s = p.read_text()
          old = (
              "  const bool native_primitive_mesh_supported =\n"
              "      ::cvars::metal_native_msl_render && mesh_shader_supported_ &&\n"
              "      !primitive_processing_result.IsTessellated();\n"
          )
          new = "  const bool native_primitive_mesh_supported = false;\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "    const bool keep_native_msl_vs_expansion =\n"
              "        host_point_list_as_triangle_strip && ::cvars::metal_native_msl_render;\n"
          )
          new = (
              "    const bool keep_native_msl_vs_expansion =\n"
              "        ::cvars::metal_native_msl_render;\n"
          )
          assert old in s
          s = s.replace(old, new, 1)

          # T30/T32: selector is unavailable on the iOS 16 Metal runtime.
          old = (
              "        cache_desc->setVisibilityResultType(\n"
              "            MTL::VisibilityResultTypeAccumulate);\n"
          )
          new = (
              "        // iOS 16 backport: visibilityResultType is unavailable.\n"
          )
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # T34: generated resolve_host_* arrays contain preprocessed,
          # NUL-terminated MSL. Compile them with the device's iOS 16 Metal
          # runtime instead of loading incompatible offline metallibs.
          p = Path("src/xenia/gpu/metal/metal_direct_host_resolve.cc")
          s = p.read_text()
          old = (
              "  dispatch_data_t data = dispatch_data_create(\n"
              "      metallib_data, metallib_size, nullptr, DISPATCH_DATA_DESTRUCTOR_DEFAULT);\n"
              "  MTL::Library* lib = device->newLibrary(data, &error);\n"
              "  dispatch_release(data);\n"
          )
          new = (
              "  const char* msl_source = reinterpret_cast<const char*>(metallib_data);\n"
              "  NS::String* ns_source =\n"
              "      NS::String::string(msl_source, NS::UTF8StringEncoding);\n"
              "  MTL::CompileOptions* compile_options =\n"
              "      MTL::CompileOptions::alloc()->init();\n"
              "  compile_options->setFastMathEnabled(true);\n"
              "  compile_options->setLanguageVersion(MTL::LanguageVersion2_4);\n"
              "  MTL::Library* lib =\n"
              "      device->newLibrary(ns_source, compile_options, &error);\n"
              "  compile_options->release();\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/ui/ios/shared/ios_view_helpers.mm")
          s = p.read_text()
          old = (
              "UIVisualEffect* xe_make_chrome_visual_effect(BOOL clear_variant) {\n"
              "  if (@available(iOS 26.0, *)) {\n"
              "    UIGlassEffectStyle style =\n"
              "        clear_variant ? UIGlassEffectStyleClear : UIGlassEffectStyleRegular;\n"
              "    return [UIGlassEffect effectWithStyle:style];\n"
              "  }\n"
              "  // iOS 18-25 fallback: the closest pre-glass UIBlurEffect for each variant.\n"
          )
          new = (
              "UIVisualEffect* xe_make_chrome_visual_effect(BOOL clear_variant) {\n"
              "  // Legacy Xcode 15 build: UIGlassEffect is an iOS 26 SDK type and is not\n"
              "  // declared by the iOS 17 SDK. iOS 16 uses this blur fallback anyway.\n"
              "  // iOS 18-25 fallback: the closest pre-glass UIBlurEffect for each variant.\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # T48 diagnostics + source-level equivalents of the validated T38/T46
          # XMP behavior. Keep normal silent clients immediate, but pace only
          # independent XMP silent drivers at 131 ms per submitted block.
          p = Path("src/xenia/apu/silent_audio_driver.h")
          s = p.read_text()
          old = '#include "xenia/apu/audio_driver.h"\n#include "xenia/base/threading.h"\n'
          new = '#include <chrono>\n\n#include "xenia/apu/audio_driver.h"\n#include "xenia/base/threading.h"\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "  explicit SilentAudioDriver(xe::threading::Semaphore* semaphore)\n"
              "      : semaphore_(semaphore) {}\n"
          )
          new = (
              "  explicit SilentAudioDriver(xe::threading::Semaphore* semaphore,\n"
              "                             uint32_t pacing_ms = 0)\n"
              "      : semaphore_(semaphore), pacing_ms_(pacing_ms) {}\n"
          )
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "  void SubmitFrame(float* samples) override {\n"
              "    (void)samples;\n"
              "    if (semaphore_) {\n"
              "      semaphore_->Release(1, nullptr);\n"
              "    }\n"
              "  }\n"
          )
          new = (
              "  void SubmitFrame(float* samples) override {\n"
              "    (void)samples;\n"
              "    if (pacing_ms_) {\n"
              "      xe::threading::Sleep(std::chrono::milliseconds(pacing_ms_));\n"
              "    }\n"
              "    if (semaphore_) {\n"
              "      semaphore_->Release(1, nullptr);\n"
              "    }\n"
              "  }\n"
          )
          assert old in s
          s = s.replace(old, new, 1)
          old = "  xe::threading::Semaphore* semaphore_ = nullptr;\n"
          new = (
              "  xe::threading::Semaphore* semaphore_ = nullptr;\n"
              "  uint32_t pacing_ms_ = 0;\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/apu/phase/phase_audio_system.cc")
          s = p.read_text()
          old = (
              "  // The independent/XMP path carries stereo content we don't spatialize; keep\n"
              "  // it silent under the PHASE backend for now.\n"
              "  return new SilentAudioDriver(semaphore);\n"
          )
          new = (
              "  // T48: XMP remains silent for now, but pace its virtual output so FFmpeg\n"
              "  // does not race to EOF and cause runaway song switching.\n"
              "  return new SilentAudioDriver(semaphore, 131);\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/apu/sdl/sdl_audio_system.cc")
          s = p.read_text()
          old = (
              "  return new SilentAudioDriver(semaphore);\n"
              "#else\n"
              "  return new SDLAudioDriver(semaphore, frequency, channels,\n"
          )
          new = (
              "  return new SilentAudioDriver(semaphore, 131);\n"
              "#else\n"
              "  return new SDLAudioDriver(semaphore, frequency, channels,\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/xenia/apu/audio_media_player.cc")
          s = p.read_text()
          old = '#include "xenia/base/logging.h"\n'
          new = '#include "xenia/base/clock.h"\n#include "xenia/base/logging.h"\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "  auto result =\n"
              "      ProcessAudioLoop(this, driver_.get(), formatContext, codecContext, 0);\n"
          )
          new = (
              "  const uint64_t xmp_decode_start_ms = xe::Clock::QueryHostUptimeMillis();\n"
              "  auto result =\n"
              "      ProcessAudioLoop(this, driver_.get(), formatContext, codecContext, 0);\n"
              "  const uint64_t xmp_decode_elapsed_ms =\n"
              "      xe::Clock::QueryHostUptimeMillis() - xmp_decode_start_ms;\n"
              "  XELOGI(\"[XMP-DIAG] decode_end result={} elapsed_ms={} song_handle={}\",\n"
              "         static_cast<int>(result), xmp_decode_elapsed_ms,\n"
              "         current_song_handle_);\n"
          )
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "  if (!IsLastSongInPlaylist()) {\n"
              "    Next();\n"
              "    return;\n"
              "  }\n"
          )
          new = (
              "  if (!IsLastSongInPlaylist()) {\n"
              "    // T38/T46 behavior: do not automatically advance after decoder EOF.\n"
              "    // The title remains authoritative for explicit XMPNext requests.\n"
              "    return;\n"
              "  }\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Once-per-second real Metal swap-rate heartbeat. This is intentionally
          # INFO level so longer tests can run with log verbosity set to Info.
          p = Path("src/xenia/gpu/metal/metal_command_processor.cc")
          s = p.read_text()
          old = '#include "xenia/base/cvar.h"\n'
          new = '#include "xenia/base/clock.h"\n#include "xenia/base/cvar.h"\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "void MetalCommandProcessor::IssueSwap(uint32_t frontbuffer_ptr,\n"
              "                                      uint32_t frontbuffer_width,\n"
              "                                      uint32_t frontbuffer_height) {\n"
          )
          new = old + (
              "#if XE_PLATFORM_IOS\n"
              "  static uint64_t diag_last_ms = 0;\n"
              "  static uint32_t diag_swaps = 0;\n"
              "  ++diag_swaps;\n"
              "  const uint64_t diag_now_ms = xe::Clock::QueryHostUptimeMillis();\n"
              "  if (!diag_last_ms) {\n"
              "    diag_last_ms = diag_now_ms;\n"
              "  } else if (diag_now_ms - diag_last_ms >= 1000) {\n"
              "    const uint64_t interval_ms = diag_now_ms - diag_last_ms;\n"
              "    const double swap_fps =\n"
              "        double(diag_swaps) * 1000.0 / double(interval_ms);\n"
              "    XELOGI(\"[PERF-DIAG] swap_fps={:.2f} interval_ms={} guest_scale={:.3f} \"\n"
              "           \"clock_no_scaling={} refresh_cap={}\",\n"
              "           swap_fps, interval_ms, xe::Clock::guest_time_scalar(),\n"
              "           cvars::clock_no_scaling, cvars::guest_display_refresh_cap);\n"
              "    diag_swaps = 0;\n"
              "    diag_last_ms = diag_now_ms;\n"
              "  }\n"
              "#endif\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Aggregate the two XMA pressure signals that dominate PGR3 logs.
          # Report once per second instead of logging each event as INFO.
          p = Path("src/xenia/apu/xma_context_new.cc")
          s = p.read_text()
          old = '#include "xenia/apu/xma_helpers.h"\n\n'
          new = '#include "xenia/apu/xma_helpers.h"\n\n#include <atomic>\n\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '#include "xenia/base/logging.h"\n'
          new = '#include "xenia/base/clock.h"\n#include "xenia/base/logging.h"\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = "namespace xe {\nnamespace apu {\n\n"
          new = (
              "namespace xe {\n"
              "namespace apu {\n\n"
              "namespace {\n"
              "std::atomic<uint64_t> g_xma_diag_full{0};\n"
              "std::atomic<uint64_t> g_xma_diag_nospace{0};\n"
              "std::atomic<uint64_t> g_xma_diag_last_ms{0};\n\n"
              "void XmaDiagEvent(bool full) {\n"
              "  if (full) {\n"
              "    g_xma_diag_full.fetch_add(1, std::memory_order_relaxed);\n"
              "  } else {\n"
              "    g_xma_diag_nospace.fetch_add(1, std::memory_order_relaxed);\n"
              "  }\n"
              "  const uint64_t now_ms = xe::Clock::QueryHostUptimeMillis();\n"
              "  uint64_t last_ms = g_xma_diag_last_ms.load(std::memory_order_relaxed);\n"
              "  if (!last_ms) {\n"
              "    g_xma_diag_last_ms.compare_exchange_strong(\n"
              "        last_ms, now_ms, std::memory_order_relaxed);\n"
              "    return;\n"
              "  }\n"
              "  if (now_ms - last_ms < 1000) {\n"
              "    return;\n"
              "  }\n"
              "  if (g_xma_diag_last_ms.compare_exchange_strong(\n"
              "          last_ms, now_ms, std::memory_order_relaxed)) {\n"
              "    const uint64_t full_count =\n"
              "        g_xma_diag_full.exchange(0, std::memory_order_relaxed);\n"
              "    const uint64_t nospace_count =\n"
              "        g_xma_diag_nospace.exchange(0, std::memory_order_relaxed);\n"
              "    XELOGI(\"[XMA-DIAG] full={} nospace={} interval_ms={}\",\n"
              "           full_count, nospace_count, now_ms - last_ms);\n"
              "  }\n"
              "}\n"
              "}  // namespace\n\n"
          )
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "  if (minimum_subframe_decode_count >\n"
              "      remaining_subframe_blocks_in_output_buffer_) {\n"
              "    XELOGD(\"XmaContext {}: No space for subframe decoding {}/{}!\", id(),\n"
          )
          new = (
              "  if (minimum_subframe_decode_count >\n"
              "      remaining_subframe_blocks_in_output_buffer_) {\n"
              "    XmaDiagEvent(false);\n"
              "    XELOGD(\"XmaContext {}: No space for subframe decoding {}/{}!\", id(),\n"
          )
          assert old in s
          s = s.replace(old, new, 1)
          old = (
              "  if (remaining_subframe_blocks_in_output_buffer_ == 0 && output_rb.empty()) {\n"
              "    XELOGAPU(\"XmaContext {}: Output ring buffer is full, invalidating output\",\n"
          )
          new = (
              "  if (remaining_subframe_blocks_in_output_buffer_ == 0 && output_rb.empty()) {\n"
              "    XmaDiagEvent(true);\n"
              "    XELOGAPU(\"XmaContext {}: Output ring buffer is full, invalidating output\",\n"
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))

          PY

      - name: Fetch XeniOS data repositories
        working-directory: upstream
        run: ./xenia-build.py fetchdata

      - name: Verify legacy Metal compiler
        run: |
          xcrun --sdk iphoneos metal --version || true
          echo 'kernel void xenios_probe(device uint* p [[buffer(0)]], uint i [[thread_position_in_grid]]) { p[i] = i; }' > /tmp/probe.metal
          xcrun --sdk iphoneos metal -std=ios-metal2.3 -miphoneos-version-min=16.0 -c /tmp/probe.metal -o /tmp/probe.air
          strings /tmp/probe.air | grep -E 'air64|apple-ios' | head -20 || true

      - name: Build and package T48
        working-directory: upstream
        run: |
          tools/build_apple_release.sh \
            --out scratch/t48 \
            --config release \
            --version 2.0.1 \
            --build-number 9849 \
            --channel preview \
            --stage stable \
            --ios-min 16.0 \
            --ios-bundle-id com.xenios.ios16.t48diag \
            --skip-macos-arm64 \
            --skip-macos-x86_64 \
            --skip-macos-universal

      - name: Stamp T48 diagnostic name and re-sign
        working-directory: upstream
        run: |
          IPA="scratch/t48/xenios_ios_iphone_ipad.ipa"
          TMP="$(mktemp -d)"
          ditto -x -k "$IPA" "$TMP"
          APP="$(find "$TMP/Payload" -maxdepth 1 -name '*.app' -type d | head -n1)"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string XeniOS iOS16 T48 DIAG" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 9849.48" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0" "$APP/Info.plist"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -name '*.dylib' -type f -print0 | \
              xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements xenia_ios.entitlements "$APP"
          rm -f "$IPA"
          (cd "$TMP" && zip -qry "$GITHUB_WORKSPACE/upstream/$IPA" Payload)
          shasum -a 256 "$IPA"

      - name: Inspect embedded Metal target strings
        working-directory: upstream
        run: |
          IPA="scratch/t48/xenios_ios_iphone_ipad.ipa"
          TMP="$(mktemp -d)"
          ditto -x -k "$IPA" "$TMP"
          APP="$(find "$TMP/Payload" -maxdepth 1 -name '*.app' -type d | head -n1)"
          echo "Main executable:"
          xcrun vtool -show-build "$APP/XeniOS"
          echo "Metal AIR target strings:"
          strings "$APP/XeniOS" | grep -E 'air64_v[0-9]+-apple-ios' | sort | uniq -c | head -50 || true

      - name: Upload T48 IPA
        uses: actions/upload-artifact@v4
        with:
          name: XeniOS-iOS16-T48-audio-perf-diag
          path: upstream/scratch/t48/xenios_ios_iphone_ipad.ipa
          if-no-files-found: error